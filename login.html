<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | School Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#4F46E5; --primary-dark:#4338CA; --primary-light:#EEF2FF;
    --success:#16A34A; --danger:#DC2626;
    --bg:#F8FAFC; --surface:#FFFFFF; --border:#E2E8F0;
    --text:#0F172A; --text-muted:#64748B;
    --radius:16px; --shadow:0 10px 30px -10px rgba(15,23,42,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Cairo', sans-serif;
    background:linear-gradient(160deg, #EEF2FF 0%, #F8FAFC 55%, #F1F5F9 100%);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; color:var(--text);
  }
  .card{ background:var(--surface); border-radius:24px; box-shadow:var(--shadow); width:100%; max-width:420px; padding:40px 32px; position:relative; overflow:hidden; }
  .card::before{ content:""; position:absolute; top:0; right:0; left:0; height:6px; background:linear-gradient(90deg, var(--primary), #818CF8); }
  .brand{ text-align:center; margin-bottom:32px; }
  .brand .logo-circle{ width:64px; height:64px; background:var(--primary-light); border-radius:18px; display:flex; align-items:center; justify-content:center; font-size:28px; margin:0 auto 14px; }
  .brand h1{ font-size:20px; font-weight:800; }
  .brand p{ color:var(--text-muted); font-size:14px; margin-top:4px; }

  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:14px; font-weight:600; margin-bottom:8px; color:var(--text); }
  .field input{ width:100%; padding:13px 16px; border:1.5px solid var(--border); border-radius:12px; font-family:inherit; font-size:15px; transition:.2s; }
  .field input:focus{ outline:none; border-color:var(--primary); box-shadow:0 0 0 4px var(--primary-light); }
  .field-password-wrap{ position:relative; }
  .toggle-password{ position:absolute; top:50%; left:14px; transform:translateY(-50%); cursor:pointer; font-size:16px; color:var(--text-muted); user-select:none; }

  .remember-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; font-size:14px; }
  .remember-row label{ display:flex; align-items:center; gap:6px; color:var(--text-muted); cursor:pointer; }

  .btn{ width:100%; padding:14px; border:none; border-radius:12px; font-family:inherit; font-size:15px; font-weight:700; cursor:pointer; transition:.2s; display:flex; align-items:center; justify-content:center; gap:8px; }
  .btn-primary{ background:var(--primary); color:#fff; }
